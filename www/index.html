<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#58BDF4">
<title>Lagoon Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* bundled fonts for the app (offline); the Google Fonts link above is the fallback on the web */
@font-face{font-family:'Rubik';font-weight:400;font-display:swap;src:url(fonts/rubik-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:400;font-display:swap;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:500;font-display:swap;src:url(fonts/rubik-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:500;font-display:swap;src:url(fonts/rubik-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:700;font-display:swap;src:url(fonts/rubik-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:700;font-display:swap;src:url(fonts/rubik-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:800;font-display:swap;src:url(fonts/rubik-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:800;font-display:swap;src:url(fonts/rubik-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* ================= Design tokens ================= */
:root{
  --ink:#1F2A44;--muted:#6B7A90;--line:#E6ECF3;
  --surface:#FFFFFF;--surface2:#F3F6FA;
  --primary:#22B07D;--primary-d:#178A61;
  --gold:#FFB21E;--gold-d:#D98A00;
  --blue:#1EA0F5;--blue-d:#0F7CC4;
  --danger:#F2545B;--danger-d:#C53A41;
  --violet:#7C5CFF;--violet-d:#5B3FD6;
  --cellA:#FFF7E8;--cellB:#FCEBCB;
  --r-s:10px;--r-m:14px;--r-l:20px;--r-xl:26px;
  --sh:0 1px 0 rgba(31,42,68,.06),0 6px 18px rgba(20,60,110,.14);
  --sh-btn:0 3px 0 rgba(0,0,0,.18);
  --cs:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#FFFFFF}}
:root[data-theme="dark"]{--surface:#FFFFFF}
html{height:100%;background:#2E9BE0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#86D6FF 0%,#58BDF4 42%,#2E9BE0 100%);user-select:none;-webkit-user-select:none;touch-action:none;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
img{-webkit-user-drag:none;user-select:none}
.ii{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
[data-a] img,.ar{width:100%;height:100%;display:block;object-fit:contain}

/* ================= Background ================= */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cl{position:absolute;background:#fff;border-radius:50px;opacity:.75;filter:blur(1px);animation:drift 90s linear infinite}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:46%;height:150%;left:16%;top:-70%}.cl::after{width:34%;height:120%;left:50%;top:-50%}
.c1{top:120px;width:90px;height:26px}.c2{top:260px;width:70px;height:20px;animation-duration:120s;animation-delay:-50s}.c3{top:60px;width:56px;height:16px;animation-duration:140s;animation-delay:-90s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(620px)}}

#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;z-index:1;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ================= HUD ================= */
.hud{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;flex:none}
.me{position:relative;width:48px;height:48px;flex:none}
.me .pav{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:#fff}
.me .pav svg{width:100%;height:100%;display:block}
.me svg.ring{position:absolute;inset:0;width:100%;height:100%}
.me b{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--violet);border:2px solid #fff;color:#fff;font-size:11px;font-weight:800;line-height:14px;text-align:center}
.pills{flex:1;display:flex;gap:6px;min-width:0}
.pill{flex:1;min-width:0;height:36px;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.96);border-radius:18px;padding:0 4px 0 0;box-shadow:0 2px 0 rgba(20,60,110,.18)}
[dir="rtl"] .pill{padding:0 0 0 4px}
.pill .ic{width:34px;height:34px;flex:none;margin-inline-start:-6px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.pill .val{flex:1;min-width:0;text-align:center;font-weight:800;font-size:15px;line-height:1;white-space:nowrap}
.pill .val small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);margin-top:2px}
.pill.en{flex:1.3}.pill.ge{flex:1.15}
.plus{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-weight:800;font-size:16px;line-height:22px;text-align:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.iconbtn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.96);padding:6px;flex:none;box-shadow:0 2px 0 rgba(20,60,110,.18)}

/* ================= Orders ================= */
.orders{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none;flex:none;touch-action:pan-x}
.orders::-webkit-scrollbar{display:none}
.order{flex:1 0 auto;min-width:0;background:var(--surface);border-radius:var(--r-l);padding:6px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,opacity .3s;position:relative}
.order .av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#fff}
.order .av svg{width:100%;height:100%;display:block}
.obody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.req{display:flex;gap:4px}
.slot{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;position:relative;padding:4px}
.slot .ar{width:100%;height:100%}
.slot.ok{background:#E3F8EE}
.slot.ok::after{content:'✓';position:absolute;top:-5px;inset-inline-end:-5px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.rew{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.go{display:none;height:26px;padding:0 12px;border-radius:13px;background:var(--primary);color:#fff;font-weight:800;font-size:12.5px;line-height:26px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.order.ready{box-shadow:0 0 0 2px var(--primary),var(--sh);animation:nudge 1.6s ease-in-out infinite}
.order.ready .go{display:block}.order.ready .rew{display:none}
.order.out{transform:scale(.7);opacity:0}

/* ================= Board ================= */
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:fadein .2s ease}
.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px}
.boardCard{background:var(--surface);padding:6px;border-radius:var(--r-xl);box-shadow:0 2px 0 rgba(20,60,110,.12),0 14px 30px rgba(20,60,110,.25)}
.board{display:grid;grid-template-columns:repeat(5,var(--cs));grid-auto-rows:var(--cs);border-radius:20px;overflow:hidden;touch-action:none}
.cell{background:var(--cellA);position:relative}
.cell.alt{background:var(--cellB)}
.cell.hov{background:#FFFDF5}
.cell.can::before{content:'';position:absolute;inset:3px;border-radius:14px;box-shadow:inset 0 0 0 3px var(--gold);background:rgba(255,178,30,.14);z-index:1}
.it{width:100%;height:100%;display:grid;place-items:center;position:relative}
.it .ar{width:84%;height:84%;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(80,50,10,.22))}
.cell.sel::after{content:'';position:absolute;inset:3px;border-radius:14px;box-shadow:inset 0 0 0 3px var(--blue);pointer-events:none;z-index:2}
.it.max::before{content:'';position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,120,.9),rgba(255,226,120,0) 70%)}
.it.gemc::before{content:'';position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(150,220,255,.85),rgba(150,220,255,0) 70%)}
.want::before{content:'✓';position:absolute;top:4px;inset-inline-end:4px;width:16px;height:16px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;z-index:3}
.gen{animation:breathe 2.6s ease-in-out infinite}
.gen::before{content:'';position:absolute;inset:5px;border-radius:16px;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 72%)}
.gen::after{content:'⚡';position:absolute;top:4px;inset-inline-end:4px;width:18px;height:18px;border-radius:50%;background:var(--gold);border:2px solid #fff;font-size:9px;display:grid;place-items:center}
.bub{width:100%;height:100%;display:grid;place-items:center;position:relative}
.bub::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(190,235,255,.5) 32%,rgba(120,200,255,.3) 70%,rgba(255,255,255,.75) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 10px rgba(120,200,255,.8);animation:wobble 2s ease-in-out infinite}
.bub .ar{width:62%;height:62%;opacity:.85;position:relative}
.bub i{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;background:var(--blue);color:#fff;border-radius:8px;padding:0 6px;border:2px solid #fff;line-height:14px}
.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
.ghost{position:fixed;z-index:50;pointer-events:none;width:var(--cs);height:var(--cs);transform:translate(-50%,-62%) scale(1.18);filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.ghost .want::before,.ghost .it::before{display:none}
.dim{opacity:.28}

/* ================= Info bar / coach ================= */
.info,.coach{flex:none;margin:6px 12px 0;height:60px;background:var(--surface);border-radius:var(--r-l);display:flex;align-items:center;gap:10px;padding:0 10px;box-shadow:var(--sh)}
.coach{display:none;font-weight:700;font-size:14px;line-height:1.3}
.coach.on{display:flex}.coach.on+.info{display:none}
.coach .av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none}
.coach .av svg{width:100%;height:100%;display:block}
.invb{flex:none;width:44px;height:44px;border-radius:var(--r-m);background:var(--surface2);padding:6px;position:relative}
.invb i{position:absolute;top:-6px;inset-inline-end:-6px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--violet);color:#fff;border-radius:9px;padding:0 6px;border:2px solid #fff;line-height:15px}
.info .ie{width:40px;height:40px;flex:none}
.info .t{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.2}
.info .t small{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.info .acts{display:flex;gap:6px}

/* ================= Buttons ================= */
.btn{height:44px;padding:0 18px;border-radius:var(--r-m);background:var(--primary);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.gold{background:var(--gold);color:#3A2600}
.btn.blue{background:var(--blue)}
.btn.coral{background:var(--danger)}
.btn.plum{background:var(--violet)}
.btn.ghostb{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(31,42,68,.08)}
.btn[disabled]{background:#D5DCE5;color:#fff;box-shadow:none}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:12px}
.btn.wide{width:100%}

/* ================= Nav ================= */
.nav{flex:none;display:flex;margin:8px 12px 10px;background:var(--surface);border-radius:var(--r-xl);padding:6px;box-shadow:var(--sh)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:18px;font-size:11px;font-weight:700;color:var(--muted);position:relative;min-height:52px;justify-content:center}
.nav button .ni{width:30px;height:30px;transition:transform .2s}
.nav button em{font-style:normal}
.nav button.on{background:#EAF5FF;color:var(--blue-d)}
.nav button.on .ni{transform:scale(1.12) translateY(-1px)}
.badge{position:absolute;top:0;inset-inline-end:16%;background:var(--danger);color:#fff;border-radius:10px;font-size:10.5px;font-style:normal;font-weight:800;min-width:18px;padding:0 5px;border:2px solid #fff;line-height:14px;text-align:center}

/* ================= Panels ================= */
.panel{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 16px;touch-action:pan-y}
.panel h2{margin:6px 4px 10px;font-size:24px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(10,60,110,.35)}
.card{background:var(--surface);border-radius:var(--r-l);padding:16px;margin-top:12px;box-shadow:var(--sh)}
.card p{margin:4px 0 0;line-height:1.5;color:#3C4A63}
html[lang="he"] .card p,html[lang="he"] .modal p{text-align:justify}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.prog{height:10px;background:#E9EEF5;border-radius:6px;overflow:hidden;margin:8px 0 4px;display:flex}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2BD48F,var(--primary));border-radius:6px;transition:width .4s}
.prog.gold i{background:linear-gradient(90deg,#FFD25A,var(--gold))}
.muted{color:var(--muted);font-size:13px;font-weight:500}
.ttl{font-weight:800;font-size:16px}
.sectionT{color:#fff;font-weight:800;margin:20px 4px 0;font-size:16px;text-shadow:0 1px 4px rgba(10,60,110,.3)}
.thumb{width:52px;height:52px;flex:none;border-radius:var(--r-m);background:var(--surface2);padding:6px}
.story{display:flex;gap:12px;align-items:flex-start}
.story .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none}
.story .av svg{width:100%;height:100%;display:block}

/* Islands */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.3);color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(20,60,110,.18)}
.chip.lock{opacity:.6}
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r-xl);overflow:hidden;box-shadow:0 2px 0 rgba(20,60,110,.12),0 14px 30px rgba(20,60,110,.25)}
.scene svg.base{position:absolute;inset:0;width:100%;height:100%}
.plot{position:absolute;width:21%;aspect-ratio:1;transform:translate(-50%,-62%);display:grid;place-items:center}
.plot .ar{filter:drop-shadow(0 6px 4px rgba(0,40,60,.3))}
.plot.next .ar{opacity:.38;filter:grayscale(.4) drop-shadow(0 4px 3px rgba(0,40,60,.2))}
.plot.next::before{content:'';position:absolute;inset:-6%;border-radius:50%;border:3px dashed rgba(255,255,255,.95);animation:spin 14s linear infinite}
.plot.locked{width:12%}
.plot.locked .ar{opacity:.85}
.plot .tag2{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;background:#fff;color:var(--ink);border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.plot.just .ar{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}

/* Tasks */
.mis{display:flex;align-items:center;gap:12px}
.rchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:#FFF4DB;color:#8A5A00;border-radius:8px;padding:2px 8px}

/* Shop */
.offer{background:linear-gradient(135deg,#FFE7A3,#FFB36B);position:relative;overflow:hidden}
.offer .big{font-size:20px;font-weight:800}
.offer .art{width:84px;height:84px;flex:none}
.timer{font-size:12px;font-weight:800;background:rgba(31,42,68,.85);color:#fff;border-radius:8px;padding:3px 8px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.pack{background:var(--surface);border-radius:var(--r-l);padding:14px 8px 12px;text-align:center;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column;align-items:center}
.pack .e{width:56px;height:56px}
.pack .q{font-weight:800;font-size:15px;margin:6px 0 10px;display:flex;align-items:center;gap:4px;min-height:20px}
.pack .btn{width:100%}
.tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--danger);border-radius:8px;padding:2px 8px;position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap}
.note{color:#fff;opacity:.92;font-size:12px;text-align:center;margin-top:16px;line-height:1.45}
.piggy{background:linear-gradient(135deg,#FFE3EE,#FFC2D9)}

/* Cards album */
.packRow{display:flex;gap:12px}
.packTile{flex:1;border-radius:var(--r-l);padding:12px;text-align:center;position:relative;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center}
.packTile.b{background:linear-gradient(160deg,#F5D3B3,#E2A773)}
.packTile.g{background:linear-gradient(160deg,#FFE9A6,#FFC23D)}
.packTile .pk{width:58px;height:58px}
.packTile .n{font-weight:800;font-size:14px;margin:4px 0 8px}
.packTile .btn{width:100%}
.packTile .cnt{position:absolute;top:-8px;inset-inline-end:-6px;background:var(--danger);color:#fff;border:2px solid #fff;border-radius:12px;min-width:26px;font-weight:800;font-size:13px;line-height:20px}
.setHead{display:flex;align-items:center;gap:8px}
.setHead .r{margin-inline-start:auto;font-size:12px;font-weight:800;background:#FFF4DB;color:#8A5A00;border-radius:8px;padding:3px 8px}
.setHead .r.done{background:#E3F8EE;color:#167A55}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tc{aspect-ratio:3/4;border-radius:16px;padding:4px;background:#fff;box-shadow:0 2px 0 rgba(31,42,68,.1),0 4px 10px rgba(31,42,68,.1);position:relative}
.tc .in{height:100%;border-radius:12px;background:linear-gradient(170deg,var(--s1),var(--s2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;text-align:center;padding:6px 4px}
.tc .ce{width:72%;aspect-ratio:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}

/* ================= Motion ================= */
@keyframes pop{0%{transform:scale(.45)}100%{transform:scale(1)}}
@keyframes popin{to{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wobble{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes lidoff{to{transform:translate(30px,-70px) rotate(35deg);opacity:0}}
@keyframes tap{0%,100%{transform:translate(-20%,-10%) scale(1)}50%{transform:translate(-20%,0%) scale(.85)}}
@keyframes dragm{0%{transform:translate(-20%,-10%)}15%{transform:translate(-20%,-10%) scale(.88)}70%,85%{transform:translate(calc(var(--dx) - 20%),calc(var(--dy) - 10%)) scale(.88)}100%{transform:translate(calc(var(--dx) - 20%),calc(var(--dy) - 10%));opacity:0}}
@media (prefers-reduced-motion:reduce){.cl,.gen,.bub::before,.order.ready,.plot.next::before,.hero .main,.hero .fl,.ad .show{animation:none!important}}
@media (max-height:700px){.nav button em{display:none}.nav button{min-height:44px}.slot{width:38px;height:38px}.order .av{width:38px;height:38px}.rew{display:none}.info,.coach{height:52px}.hud{padding-top:4px}}

.mile .mc .cb{width:48px;height:48px;border-radius:14px;background:#fff;box-shadow:var(--sh);padding:6px}
.mile .mc.ready .cb{box-shadow:0 0 0 3px var(--gold),var(--sh);animation:breathe 1.2s ease-in-out infinite}
.mile .mc.done .cb{opacity:.45}
.mile .mc span{font-size:11px;font-weight:800;color:var(--muted)}
@media (max-height:700px){.evb{width:44px;height:44px;padding:5px}.dbtn{width:56px;height:56px}.dock .info,.dock .coach{height:56px}.dbtn span:not(.ic2):not(.badge):not(.x){display:none}}

/* ================= v10 skin: painted island look (wood signs, parchment panels, glossy buttons) ================= */
@font-face{font-family:'Lilita One';font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--wood1:#D99A55;--wood2:#A8652F;--wood3:#7A4520;--parch:#FFF6E2;--parch2:#FBE9C7;--edge:#E7C48E;
  --display:'Lilita One','Rubik',system-ui,sans-serif}
body{background:linear-gradient(180deg,#7FD3FF 0%,#4FC1F2 38%,#2AA7E3 70%,#1C8FD0 100%)}
.bg::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-40px;height:180px;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
/* display type with outline, like the references */
.dsp,.brand,.cctitle,.panel h2,.modal h3,.pill .val,.me b,.chip2,.go,.btn,.abtn,.dbtn,.evb .lab,.ttl{font-family:var(--display);letter-spacing:.2px}
html[lang="he"] .dsp,html[lang="he"] .brand,html[lang="he"] .cctitle,html[lang="he"] .panel h2,html[lang="he"] .modal h3,html[lang="he"] .btn,html[lang="he"] .abtn,html[lang="he"] .dbtn,html[lang="he"] .evb .lab,html[lang="he"] .ttl{font-family:'Rubik',sans-serif;font-weight:800}
/* wooden sign */
.panel h2,.modal h3.sign,.brand,.cctitle{position:relative;display:inline-block;color:#fff;padding:8px 26px 10px;border-radius:14px;
  background:repeating-linear-gradient(0deg,rgba(90,45,10,.10) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.15),0 4px 0 var(--wood3),0 8px 14px rgba(60,30,10,.25);
  text-shadow:0 2px 0 var(--wood3),1px 0 0 var(--wood3),-1px 0 0 var(--wood3),0 -1px 0 var(--wood3)}
.panel h2{font-size:24px;margin:10px auto 12px;display:table}
.panel h2::before,.panel h2::after,.brand::before,.brand::after{content:'';position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F3E3C6,#8A6A4A)}
.panel h2::before,.brand::before{left:9px}.panel h2::after,.brand::after{right:9px}
.brand{font-size:34px;line-height:1.05;margin:4px auto 0;display:table;padding:10px 34px 12px}
.brand small{font-family:'Rubik',sans-serif;font-size:13px;font-weight:700;text-shadow:0 1px 0 var(--wood3);opacity:1}
.cctitle{font-size:24px;display:table;margin:0 auto}
/* parchment surfaces */
.card,.sheet,.modal,.order,.info,.coach,.pack,.packTile{background:linear-gradient(180deg,#FFFDF6,var(--parch));box-shadow:0 0 0 2.5px var(--edge),0 4px 0 #D9B57D,0 10px 20px rgba(40,60,90,.18)}
.modal{border-radius:24px;padding-top:26px;position:relative}
.modal h3{font-size:22px;color:var(--ink)}
.card{border-radius:18px}
.boardCard{background:repeating-linear-gradient(90deg,rgba(90,45,10,.10) 0 2px,transparent 2px 14px),linear-gradient(180deg,var(--wood1),var(--wood2));padding:8px;border-radius:24px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 5px 0 var(--wood3),0 14px 26px rgba(30,60,90,.3)}
.board{gap:3px;background:#C08A4F;border-radius:16px;padding:3px}
.cell{border-radius:10px;background:#FBEBC7;box-shadow:inset 0 -2px 0 rgba(160,110,50,.18)}
.cell.alt{background:#F5DCA8}
.cell.sel::after,.cell.can::before{border-radius:10px;inset:1px}
/* HUD */
.pill{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 3px 0 rgba(20,60,110,.25)}
.pill .val{font-size:17px;color:#2B2B3A}
.me b{background:linear-gradient(#5AA8FF,#2D6FE0);font-size:12px}
.iconbtn{border-radius:50%;background:linear-gradient(#6FB8FF,#2F7FE6);padding:7px;box-shadow:0 0 0 2px #fff,0 3px 0 rgba(20,60,110,.3)}
/* event tiles with labels */
.evb{width:56px;height:62px;border-radius:16px;padding:5px 6px 16px;background:linear-gradient(180deg,#FFFDF6,var(--parch));box-shadow:0 0 0 2.5px var(--edge),0 3px 0 #D9B57D}
.evb .lab{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10.5px;color:#6B4A22;line-height:1}
.evb .chip2{bottom:auto;top:-8px;background:#E8574A;font-family:var(--display)}
.evb .fillbar{bottom:15px}
/* buttons: glossy game style */
.btn{border-radius:14px;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.18)}
.btn,.abtn.primary{background:linear-gradient(180deg,#7FD957,#3DAA33)}
.btn.gold,.abtn.mail{background:linear-gradient(180deg,#FFD453,#F5A315);color:#5A3300;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.blue{background:linear-gradient(180deg,#62C5FF,#2384E0)}
.btn.coral{background:linear-gradient(180deg,#FF8A7A,#E9483B)}
.btn.plum{background:linear-gradient(180deg,#B08CFF,#7651E6)}
.btn.ghostb{background:linear-gradient(180deg,#FFFFFF,#F1E6D2);color:#6B4A22;text-shadow:none}
.btn[disabled]{background:linear-gradient(180deg,#D9D3C7,#BDB5A6);color:#fff}
.abtn.primary{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.go{background:linear-gradient(180deg,#7FD957,#3DAA33)}
/* dock */
.dbtn{background:linear-gradient(180deg,#FFFDF6,var(--parch));box-shadow:0 0 0 2.5px var(--edge),0 4px 0 #D9B57D;color:#6B4A22}
#townBtn{background:linear-gradient(180deg,#7FD957,#3DAA33);color:#fff;box-shadow:0 0 0 2.5px #fff,0 4px 0 #2B8A26}
/* town: big green play button like the reference */
.backb{width:84px;height:84px;padding:0;border-radius:50%;justify-content:center;background:radial-gradient(circle at 35% 30%,#A5EE73,#3DAA33 70%);box-shadow:0 0 0 4px #fff,0 6px 0 #2B8A26,0 14px 26px rgba(0,0,0,.3);inset-inline-start:auto;inset-inline-end:16px}
.backb .ic2{display:none}
.backb::before{content:'';width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:28px solid #fff;margin-left:8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
[dir="rtl"] .backb::before{border-left:0;border-right:28px solid #fff;margin-left:0;margin-right:8px}
.backb span[data-t]{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.scene{box-shadow:0 0 0 4px #fff,0 14px 30px rgba(20,60,110,.3)}
.plot{width:24%}
.plot .ar{filter:drop-shadow(0 8px 5px rgba(0,40,60,.35))}
.deco3d{position:absolute;pointer-events:none;filter:drop-shadow(0 5px 3px rgba(0,40,60,.3))}
/* tabs (Main / Daily) */
.tabs{display:flex;background:rgba(255,255,255,.35);border-radius:16px;padding:4px;gap:4px;margin:0 0 4px}
.tabs button{flex:1;height:42px;border-radius:12px;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tabs button.on{background:linear-gradient(180deg,#62C5FF,#2384E0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
html[lang="he"] .tabs button{font-family:'Rubik',sans-serif;font-weight:800}
.gobtn{height:38px;padding:0 18px}
/* creator & login */
.seg button.on[data-g="m"]{background:linear-gradient(180deg,#62C5FF,#2384E0);color:#fff}
.seg button.on[data-g="f"]{background:linear-gradient(180deg,#FF8FC2,#E8508F);color:#fff}
.ovx{background:linear-gradient(180deg,#FF8A7A,#E9483B);color:#fff;box-shadow:0 0 0 3px #fff,0 3px 0 rgba(0,0,0,.2)}
@media (max-height:700px){.evb{width:48px;height:54px;padding:4px 5px 14px}.dbtn .x{display:block}}
.order{flex:1 1 0}.go{padding:0 8px;font-size:12px}.order.ready .av{width:34px;height:34px}

img.por{width:100%;height:100%;object-fit:cover;display:block;background:#FFE9D6}
.ccsub{text-align:center;color:#fff;font-weight:700;margin:8px 0 0;text-shadow:0 1px 3px rgba(10,60,110,.35)}
.stage{position:relative;height:300px;display:flex;justify-content:center;align-items:flex-end;margin-top:6px}
.stage .glow{position:absolute;bottom:4px;width:240px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
.fullhero{position:relative;height:290px;width:auto;filter:drop-shadow(0 10px 12px rgba(10,40,80,.3))}
.ccth{width:62px;height:62px}
.hero.duo{height:250px}
.hero.duo .main{width:120px;height:120px;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);opacity:.95}
.hero.duo .hm,.hero.duo .hf{position:absolute;bottom:0;height:240px;filter:drop-shadow(0 10px 12px rgba(10,40,80,.3));animation:floaty 4.5s ease-in-out infinite}
.hero.duo .hm{left:12%}.hero.duo .hf{right:12%;animation-delay:-2s}
@media (max-height:700px){.stage{height:220px}.fullhero{height:210px}.hero.duo{height:190px}.hero.duo .hm,.hero.duo .hf{height:180px}}

/* v11 island: painted map + 3-stage buildings */
.scene.isle{background:#1C8FD0}
.isleimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plot2{position:absolute;aspect-ratio:1;transform:translate(-50%,-80%);padding:0;background:none;border:0;display:block;-webkit-tap-highlight-color:transparent}
.plot2 .ar{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,40,30,.35));transition:transform .2s}
.plot2.empty{transform:translate(-50%,-66%)}
.plot2.empty .ar{opacity:.92}
.plot2.sel .ar{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #FFD453) drop-shadow(0 6px 4px rgba(0,40,30,.35))}
.plot2:active .ar{transform:scale(.95)}
.plot2 .stars{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:-1px;color:#FFC21A;text-shadow:0 1px 0 #7A4520,0 0 2px #7A4520;white-space:nowrap;pointer-events:none}
.plot2 .upb{position:absolute;top:8%;right:6%;width:24px;height:24px;border-radius:50%;font-style:normal;font-weight:900;font-size:13px;line-height:24px;text-align:center;color:#fff;background:linear-gradient(#7FD957,#3DAA33);box-shadow:0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.3);animation:breathe 1.5s ease-in-out infinite;pointer-events:none}
.plot2.just .ar{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.bsel{display:flex;align-items:center;gap:10px;margin-top:12px}
.bprev{width:76px;height:76px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 60%,#FFF6E2,#F3DDB0);box-shadow:inset 0 0 0 2px var(--edge);padding:4px}
.bprev .ar{width:100%;height:100%;object-fit:contain}
.stg{display:flex;align-items:center;gap:4px;margin:3px 0}
.stg i{width:18px;height:7px;border-radius:4px;background:#E6D6B8}
.stg i.on{background:linear-gradient(90deg,#FFD453,#F5A315)}
.stg i.nx{background:#BDE6A5;animation:breathe 1.4s ease-in-out infinite}
.stg .muted{margin-inline-start:4px;font-size:11.5px}
#bBuild{flex-direction:column;gap:0;line-height:1.1;padding:6px 14px;min-width:92px}
#bBuild .bl{font-size:12px;opacity:.95}

/* v12 painted board + tiles */
.hero.duo{height:200px;margin-top:0}.hero.duo .hm,.hero.duo .hf{height:196px}.hero.duo .main{width:96px;height:96px}
.logoW{position:relative;z-index:2}
@media (max-height:700px){.hero.duo{height:120px}.hero.duo .hm,.hero.duo .hf{height:118px}.hero.duo .main,.hero.duo .fl{display:none}.logoW .logo{width:46%}}
.boardCard{border:20px solid transparent;border-image:url(art/board_frame.webp) 62 stretch;padding:4px;border-radius:0;background:#E9C98C;background-clip:padding-box;box-shadow:none;filter:drop-shadow(0 10px 14px rgba(30,60,90,.3))}
.board{gap:2px;background:transparent;padding:0;border-radius:6px}
.cell,.cell.alt{background:url(art/tile_a.webp) center/100% 100% no-repeat;box-shadow:none;border-radius:9px}

.bub .ar{width:60%;height:60%;opacity:.9}
.logoW{text-align:center;margin-top:2px}

.mile .mc .cb{background:none;box-shadow:none;padding:0;width:54px;height:54px}
.mile .mc.ready .cb{box-shadow:none;filter:drop-shadow(0 0 6px #FFD453)}

/* v13 painted album cards */
.tc{aspect-ratio:2/3;padding:0;background:none;box-shadow:0 4px 10px rgba(31,42,68,.22);border-radius:12px}
.tc .in{position:relative;overflow:hidden;padding:0;border-radius:12px;background:#E9DCC0;display:block}

/* ===== v14 painted main screen: beach bg, wood HUD, ticket orders, info bar, bottom nav ===== */

/* HUD */

/* generator: clearly a source */

function newOrder(slot,easy){
  if(!newOrder.tmp){newOrder.tmp=[];setTimeout(()=>{newOrder.tmp=null},0)}

  const who=easy&&slot===0?'lili':pool[Math.floor(Math.random()*pool.length)]||'kai',cs=chainsOpen();newOrder.tmp.push(who);
  const n=(!easy&&S.lvl>=2&&Math.random()<(S.lvl<6?.35:.55))?2:1,maxL=S.lvl<4?3+Math.floor(S.lvl/2):Math.min(10,3+Math.floor(S.lvl/3)+S.island),req=[];
  for(let k=0;k<n;k++){const c=easy?(slot===0?'drink':'beach'):cs[Math.floor(Math.random()*cs.length)];const l=easy?2:Math.min(maxL,2+Math.floor(Math.pow(Math.random(),S.lvl<6?1.6:1.15)*(maxL-1)));req.push({c,l})}
  const mult=1+S.island*.3;

const MT=['deliver','merge','spawn','make','coins','build','gems'];
function newMission(){
  const have=S.ms.map(m=>m.t),pool=MT.filter(x=>!have.includes(x)&&(x!=='gems'||S.lvl>=4)),tp=pool[Math.floor(Math.random()*pool.length)],L0=S.lvl;
  let g=1,p=0;
  if(tp==='deliver')g=3+Math.floor(L0/6);if(tp==='merge')g=12+L0;if(tp==='spawn')g=20+L0*2;if(tp==='make'){p=Math.min(6,3+Math.floor(L0/7))}
  if(tp==='coins')g=Math.round((80+L0*40)/10)*10;if(tp==='gems')g=2;
  const rw=[{k:'coins',v:30+L0*15},{k:'gems',v:5+Math.floor(L0/10)},{k:'energy',v:30},{k:'pack',v:1}][Math.floor(Math.random()*4)];
  return {t:tp,g,p,c:0,rw};
}

function mEv(tp,n=1,lv=0,x=''){
  const dc=dcState();let ch=false;hqEv(tp,n,lv,x);
  dc.q.forEach(m=>{if(m.c>=m.g)return;
    if(tp==='make'&&m.t==='make'){if(lv>=m.p){m.c=1;ch=true}}
    else if(tp==='make'&&m.t==='chain'){if(x===m.x&&lv>=m.p){m.c=Math.min(m.g,m.c+1);ch=true}}
    else if(tp==='deliver'&&m.t==='who'){if(x===m.x){m.c=Math.min(m.g,m.c+1);ch=true}}
    else if(m.t===tp&&tp!=='make'){m.c=Math.min(m.g,m.c+n);ch=true}
    else return;if(m.c>=m.g)toast(t('dcDone'))});
  if(ch){renderBadges();if(current()==='scrMissions')renderMissions()}
}

const boardEl=$('board'),wrap=$('wrap');
function layout(){
  /* adaptive: board takes the space left. On short screens the event buttons move to columns beside the board. */
  const scr=$('scrBoard'),ev=$('evrow');if(!wrap||!scr)return;
  const side=scr.classList.contains('side');
  if(!side)layout.ev=ev.offsetHeight||layout.ev||60;
  const EV=layout.ev||60,W=wrap.clientWidth,H=wrap.clientHeight+(side?-EV:0);if(W<=0||H<=0)return;
  const FR=window.innerHeight<700?40:52,GAP=12;
  const fit=(w,h)=>Math.floor(Math.min((w-FR-GAP)/COLS,(h-FR-GAP-8)/ROWS));
  const csRow=fit(W-16,H),csSide=fit(W-2*54,H+EV);
  const useSide=csSide>csRow+3;
  if(useSide!==side){scr.classList.toggle('side',useSide);requestAnimationFrame(layout);return}
  const cs=Math.max(34,Math.min(96,useSide?csSide:csRow));
  const st=document.documentElement.style;st.setProperty('--cs',cs+'px');st.setProperty('--cw',cs+'px');st.setProperty('--ch',cs+'px');
  if(useSide)ev.style.top=(wrap.offsetTop+10)+'px';else ev.style.top='';
  const hb=document.querySelector('.hud').getBoundingClientRect().bottom,nv=document.querySelector('.gnav').getBoundingClientRect();
  st.setProperty('--hudb',Math.round(hb)+'px');st.setProperty('--navh',Math.round(innerHeight-nv.top+2)+'px');

function hqState(){
  if(!S.hq||S.hq.d!==today()){const L=S.lvl,cs=chainsOpen(),types=['make','merge','deliver','energy'];if(L>=6)types.push('build');
    const tp=types[Math.floor(Math.random()*types.length)];let g=1,p=0,x='';
    if(tp==='make'){x=cs[Math.floor(Math.random()*cs.length)];p=Math.min(11,6+Math.floor(L/5))}
    if(tp==='merge')g=120+L*6;if(tp==='deliver')g=10+Math.floor(L/3);if(tp==='energy')g=350+L*12;if(tp==='build')g=3;
    S.hq={d:today(),t:tp,g,p,x,c:0,cl:0,seen:0,rw:{gems:40+L,energy:150}}}
  return S.hq}
function hqEv(tp,n,lv,x){if(S.tut<3)return;const q=hqState();if(q.cl||q.c>=q.g)return;
  if(q.t==='make'){if(tp==='make'&&x===q.x&&lv>=q.p)q.c=1}else if(q.t===tp)q.c=Math.min(q.g,q.c+n);else return;
  if(q.c>=q.g){setTimeout(()=>{toast(t('hqDoneT'));renderBadges()},300)}}
function hqText(q){return t('hq_'+q.t,fmtN(q.g),q.p,q.x?loc(CH[q.x].gn):'')}
function hqArt(q){return q.t==='make'?A(q.x+q.p):A({merge:'q_merge',deliver:'q_deliver',energy:'bolt',build:'q_build'}[q.t])}
function hqCard(){const q=hqState(),done=q.c>=q.g;

   <div class="hqrw"><span>${ic('gem')} ${q.rw.gems}</span><span>${ic('bolt')} ${q.rw.energy}</span><span>${ic('pack')} ${t('gold')}</span><span>${A('chest3')}</span></div>
   <button class="btn wide ${done&&!q.cl?'gold':'ghostb'}" id="hqB" ${done&&!q.cl?'':'disabled'}>${q.cl?'✓ '+t('claimed'):t('claim')}</button></div>`}
function hqClaim(){const q=hqState();if(q.c<q.g||q.cl)return;q.cl=1;S.gems+=q.rw.gems;setEnergy(S.energy+q.rw.energy);S.packs.g++;placeChest(3);sfx('level');save();refresh();rerenderPanel();

/* =================== built-in end-to-end self test (TEST_MODE) =================== */
const QA={
  inv(){const P=[],bad=m=>P.push(m);
    if(S.board.length!==N)bad('board size');
    S.board.forEach((v,i)=>{if(!v)return;if(!['i','g','c','b'].includes(v.t))bad('bad tile '+i);
      if((v.t==='i'||v.t==='b')&&(!CH[v.c]||!(v.l>=1&&v.l<=CH[v.c].max)))bad('bad item '+v.c+v.l);
      if(v.t==='g'&&!CH[v.c])bad('bad generator '+v.c);if(v.t==='c'&&!(v.k>=1&&v.k<=3))bad('bad chest')});
    ['coins','gems','energy','xp','lvl','piggy'].forEach(k=>{if(!Number.isInteger(S[k])||S[k]<0)bad(k+' = '+S[k])});
    if(S.lvl<1||S.lvl>MAXLV)bad('level out of range');
    if(S.orders.length!==3||S.orders.some(o=>!o||!o.req||!o.req.length))bad('orders broken');
    S.orders.forEach(o=>o&&o.req&&o.req.forEach(r=>{if(!CH[r.c]||CH[r.c].ev||r.c==='gem'||r.c==='tools')bad('order asks '+r.c)}));
    if(!Array.isArray(S.bs)||S.bs.length!==6||S.bs.some(x=>x<0||x>3))bad('buildings '+S.bs);
    if(S.island<0||S.island>=ISL.length)bad('island');
    if(S.inv.some(v=>!v))bad('storage hole');
    const g=S.board.concat(S.inv).filter(v=>v&&v.t==='g').map(v=>v.c);if(new Set(g).size!==g.length)bad('duplicate generator');
    try{JSON.parse(JSON.stringify(S))}catch(e){bad('save not serializable')}
    return P},
  async run(n=1500){
    const snap=JSON.stringify(S),snd=S.sound,mus=S.music,oldToast=window.toast;S.sound=false;Music.stop&&Music.stop();
    const rep={steps:0,actions:{},errors:[],inv:{},t0:Date.now()},R_=a=>a[Math.floor(Math.random()*a.length)],add=(o,k)=>o[k]=(o[k]||0)+1;
    const realShowAd=window.showAd;window.showAd=(k,f)=>{if(adCan(k)){const a=adsState();a[k]++;a.n++;f()}};
    S.tut=3;closeModal();
    for(let i=0;i<n;i++){
      try{if(modalOpen){closeModal();continue}
        if(S.energy<10)S.energy+=50;const r=Math.random();let act='';
        if(r<.28){const gs=S.board.map((v,j)=>v&&v.t==='g'?j:-1).filter(j=>j>=0);if(gs.length){spawn(R_(gs));act='spawn'}}
        else if(r<.52){const m={};let pr=null;S.board.forEach((v,j)=>{if(v&&v.t==='i'&&v.l<CH[v.c].max){const k=v.c+v.l;if(m[k]!=null&&!pr)pr=[m[k],j];m[k]=j}});if(pr){drop(pr[0],pr[1]);act='merge'}}
        else if(r<.60){const o=Math.floor(Math.random()*3);deliver(o);deliver(o);act='deliver'}
        else if(r<.64){const c=S.board.findIndex(v=>v&&v.t==='c');if(c>=0){openChest(c);act='chest'}}
        else if(r<.67){const it=S.board.map((v,j)=>v&&v.t==='i'?j:-1).filter(j=>j>=0);if(it.length){sellItem(R_(it));act='sell'}}
        else if(r<.69){const it=S.board.map((v,j)=>v&&v.t==='i'?j:-1).filter(j=>j>=0);if(it.length){storeItem(R_(it));act='store'}}
        else if(r<.71){toggleBoost();act='boost'}
        else if(r<.76){S.coins+=4000;selB=null;renderIsland();if(!islDone())bReqs(S.island,S.bs[selB]).forEach(r=>{if(reqAt(r)<0){const j=nearestEmpty(0);if(j>=0)S.board[j]={t:'i',c:r.c,l:r.l}}});renderIsland();const b=$('bBuild');if(b&&!b.disabled)b.click();const sb=$('bSail');if(sb&&Math.random()<.5)sb.click();act='build'}
        else if(r<.78){const b=S.board.findIndex(v=>v&&v.t==='b');if(b>=0){S.gems+=20;popBubble(b);const bt=document.querySelector('#modal .btns button');bt&&bt.click();act='bubble'}}
        else if(r<.80){if(S.packs.b)openPack('b');act='pack'}
        else if(r<.82){addXP(25);act='xp'}
        else if(r<.84){if(S.lvl>=4){openEvent();document.querySelectorAll('#modal .evm.ready').forEach(b=>b.click())}act='event'}
        else if(r<.86){const sp=S.board.map((v,j)=>v?-1:j).filter(j=>j>=0),it=S.board.map((v,j)=>v&&v.t!=='b'?j:-1).filter(j=>j>=0);if(sp.length&&it.length){drop(R_(it),R_(sp));act='move'}}
        else if(r<.89){const k=R_(ADK);showAd(k,()=>{});act='ad'}
        else if(r<.92){renderMissions();renderCards();renderShop();act='screens'}
        else{sel=-1;renderInfo();const pb=$('prodB');if(pb){pb.click();act='produce'}}
        if(act)add(rep.actions,act);rep.steps++;
        QA.inv().forEach(x=>add(rep.inv,x));
      }catch(e){rep.errors.push((e.message||e)+'');if(rep.errors.length>20)break}
      if(i%100===0)await new Promise(r=>setTimeout(r,0));
    }
    rep.ms=Date.now()-rep.t0;rep.reached={lvl:S.lvl,island:S.island};
    window.showAd=realShowAd;S=JSON.parse(snap);S.sound=snd;S.music=mus;migrate();save();closeModal();go('Board');refresh();if(S.music&&Music.start)Music.start();
    return rep},
  async ui(){toast('🧪 …');const r=await QA.run();const ok=!r.errors.length&&!Object.keys(r.inv).length;
    const list=(o)=>Object.entries(o).map(([k,v])=>`<li>${k}: ${v}</li>`).join('');
    modal({e:ok?'check':'lock',title:ok?'Self-test passed':'Self-test found problems',
      html:`<div style="text-align:start;font-size:13px"><b>${r.steps}</b> actions in ${(r.ms/1000).toFixed(1)}s · reached level ${r.reached.lvl}, island ${r.reached.island+1}<ul>${list(r.actions)}</ul>${r.errors.length?`<b>Errors</b><ul>${r.errors.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}${Object.keys(r.inv).length?`<b>Rule violations</b><ul>${list(r.inv)}</ul>`:''}<p class="muted">Your real progress was restored after the test.</p></div>`,
      btns:[{t:t('close'),cls:'gold'}]})}
};

const Nick={
  RES:['admin','administrator','moderator','mod','support','staff','official','lagoon','lagoonisle','system','null','undefined','guest','player','lili','rosa','sam','kai','grandma','captainsam','anthropic','claude','apple','google','facebook'],

    if(pos===3||pos===7)this.note(t0,mtf(ch[0]-12+7),.25,'triangle',.06);

    const MEL=[[76,0],[79,2],[81,3],[79,5],[76,6],[74,8],[72,10],[74,11],[76,12],[72,14],[69,16],[72,18],[74,19],[72,21],[69,22],[67,24],[69,26],[72,27],[74,28],[79,30]];
    if(Math.floor(st/32)%2===1){const p=st%32;MEL.forEach(([m,s])=>{if(s===p)this.marimba(t0,mtf(m),.05)})}
  }
};
function sfx(k){
  if(!S.sound)return;
  const T={tap:[[600,.04,'sine',.03]],open:[[520,.08,'sine',.05],[780,.1,'sine',.04,.05]],pop:[[660,.08,'triangle',.06]],
   spawn:[[420,.07,'sine',.06],[620,.06,'sine',.04,.03]],spawnB:[[420,.07,'sine',.06],[620,.06,'sine',.05,.03],[930,.1,'triangle',.05,.06]],
   coin:[[1320,.08,'square',.025],[1760,.14,'square',.02,.06]],deliver:[[660,.12,'triangle',.07],[880,.12,'triangle',.07,.08],[1320,.2,'triangle',.07,.16]],
   level:[[523,.16,'triangle',.08],[659,.16,'triangle',.08,.1],[784,.16,'triangle',.08,.2],[1047,.3,'triangle',.08,.3]],
   chest:[[392,.1,'triangle',.07],[523,.1,'triangle',.07,.07],[659,.1,'triangle',.07,.14],[880,.25,'sine',.06,.21]],
   discover:[[988,.08,'sine',.05],[1319,.16,'sine',.05,.07]],boost:[[300,.12,'sawtooth',.03],[600,.16,'sawtooth',.03,.08]],
   whoosh:[[200,.3,'sine',.04],[400,.25,'sine',.03,.05]]};
  (T[k]||T.tap).forEach(a=>tone(a[0],a[1],a[2],a[3],a[4]||0));
}
function audioUnlock(){Music.start();removeEventListener('pointerdown',audioUnlock)}
addEventListener('pointerdown',audioUnlock);
document.addEventListener('visibilitychange',()=>{if(document.hidden)Music.stop();else if(S.music)Music.start()});

/* =================== nav + loop =================== */
function current(){const o=document.querySelector('.ovl.on');return o?o.id:'scrBoard'}
function rerenderPanel(){const c=current();if(c==='scrIsland')renderIsland();if(c==='scrShop')renderShop();if(c==='scrRank')renderRank();if(c==='scrCards')renderCards();if(c==='scrMissions')renderMissions();renderBadges()}
function rerenderAll(){refresh();rerenderPanel()}
function navSync(s){const m={Board:'navMerge',Island:'townBtn',Cards:'evAlbum',Shop:'evShop'};document.querySelectorAll('.gnav .nb').forEach(b=>b.classList.toggle('on',b.id===(m[s]||'navMerge')))}
function go(s){
  navSync(s);const cur=current();
  if(s==='Board'){document.querySelectorAll('.ovl.on').forEach(o=>{if(o.id!=='scrIsland')o.classList.remove('on')});if($('scrIsland').classList.contains('on'))closeTown();layout();refresh();return}
  if(s==='Island'){mapView=false;document.querySelectorAll('.ovl.on').forEach(o=>{if(o.id!=='scrIsland')o.classList.remove('on')});openTown();return}
  document.querySelectorAll('.ovl.on').forEach(o=>o.classList.remove('on'));
  const el=$('scr'+s);el.classList.add('on','sheetin');setTimeout(()=>el.classList.remove('sheetin'),320);
  if(s==='Shop')renderShop();if(s==='Rank')renderRank();if(s==='Cards')renderCards();if(s==='Missions')renderMissions();
  sfx('open');updateHand();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tone(500,.05,'sine',.04);go(b.dataset.s)});
$('hEnBtn').onclick=()=>S.energy<E_MAX?openEnergy():toast(t('eFull'));
$('hGeBtn').onclick=()=>go('Shop');
$('gear').onclick=openSettings;
$('hLvlBtn').onclick=()=>toast((S.player?S.player.nick+' · ':'')+t('lvlInfo',S.lvl,S.xp,need(S.lvl)));
setInterval(()=>{
  if(S.energy<E_MAX){const add=Math.floor((Date.now()-S.lastE)/(E_SEC*1000));if(add>0){S.energy=Math.min(E_MAX,S.energy+add);S.lastE+=add*E_SEC*1000;if(S.energy>=E_MAX)S.lastE=Date.now();save()}}else S.lastE=Date.now();
  let bub=false,gone=false;S.board.forEach((v,i)=>{if(v&&v.t==='b'){bub=true;if(Date.now()>v.exp){S.board[i]=null;gone=true}}});
  if(bub&&!D&&current()==='scrBoard'){if(gone){if(sel>=0&&!S.board[sel])sel=-1;refresh()}else boardEl.querySelectorAll('.bub i').forEach(el=>{const v=S.board[+el.closest('.cell').dataset.i];if(v)el.textContent=Math.max(0,Math.ceil((v.exp-Date.now())/1000))})}
  renderHUD();const ot=$('offT');{let ch=false;const now=Date.now();S.orders.forEach(o=>{if(o.exp&&o.exp<now){delete o.exp;ch=true}});if(ch&&!D)renderOrders();else document.querySelectorAll('.otm').forEach((e,k)=>{const o=S.orders.filter(x=>x.exp)[k];if(o)e.textContent=fmt(o.exp-now).slice(3)})}if(ot)ot.textContent=fmt(S.offerEnd-Date.now());
  const bd=$('bD');if(bd&&S.daily===today())bd.textContent=fmt(untilMidnight());
},1000);
$('evDaily').onclick=()=>{msTab='daily';go('Missions')};$('evAlbum').onclick=()=>go('Cards');$('evGift').onclick=()=>{sfx('open');openDaily()};$('storeBtn').onclick=()=>{sfx('open');openInv()};
$('evPiggy').onclick=()=>go('Shop');$('evRank').onclick=()=>go('Rank');$('evEvent').onclick=()=>{sfx('open');openEvent()};$('evShop').onclick=()=>go('Shop');$('townBtn').onclick=()=>go('Island');$('navMerge').onclick=()=>{sfx('tap');go('Board')};$('backB').onclick=()=>go('Board');$('boostBtn').onclick=toggleBoost;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>go('Board'));
document.querySelectorAll('[data-a]').forEach(e=>e.innerHTML=A(e.dataset.a));
applyLang();layout();refresh();
Auth.load();
if(!Auth.u)showAuth();else if(!S.player)showCreator(false);else{if(S.tut>=3&&S.daily!==today())setTimeout(openDaily,600);setTimeout(hqIntro,900)}
Native.init();
</script>
